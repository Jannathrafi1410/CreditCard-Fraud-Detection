# ==============================================================================
# Credit Card Fraud Detection Configuration File
# Project: Credit Card Fraud Detection Using Machine Learning and Big Data
# ==============================================================================

project:
  name: "Credit Card Fraud Detection"
  version: "1.0.0"
  author: "B.Tech Data Science Project"
  description: "End-to-End Fraud Detection System using Random Forest, PySpark, and Streamlit"

paths:
  raw_data: "data/raw/creditcard.csv"
  processed_train_data: "data/processed/train_data.parquet"
  processed_test_data: "data/processed/test_data.parquet"
  sample_data: "data/sample/sample_transactions.csv"
  batch_test_data: "data/sample/test_batch_transactions.csv"
  model_dir: "models"
  model_file: "models/random_forest_model.joblib"
  scaler_file: "models/scaler.joblib"
  metrics_file: "reports/metrics/evaluation_metrics.json"
  confusion_matrix_file: "reports/metrics/confusion_matrix.json"
  figures_dir: "reports/figures"
  diagrams_dir: "diagrams"

data:
  target_column: "Class"
  time_column: "Time"
  amount_column: "Amount"
  features:
    - "Time"
    - "V1"
    - "V2"
    - "V3"
    - "V4"
    - "V5"
    - "V6"
    - "V7"
    - "V8"
    - "V9"
    - "V10"
    - "V11"
    - "V12"
    - "V13"
    - "V14"
    - "V15"
    - "V16"
    - "V17"
    - "V18"
    - "V19"
    - "V20"
    - "V21"
    - "V22"
    - "V23"
    - "V24"
    - "V25"
    - "V26"
    - "V27"
    - "V28"
    - "Amount"
  test_size: 0.20
  random_state: 42
  stratify: true
  scaling:
    method: "RobustScaler"
    columns_to_scale:
      - "Time"
      - "Amount"

model:
  algorithm: "RandomForestClassifier"
  parameters:
    n_estimators: 100
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: "balanced"
    n_jobs: -1
    random_state: 42
  decision_threshold: 0.50

spark:
  app_name: "CreditCardFraudDistributedAnalytics"
  master: "local[*]"
  driver_memory: "2g"
  output_dir: "data/processed/spark_aggregated_metrics"
